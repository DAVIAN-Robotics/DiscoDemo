[project]
name = "fmb"
version = "0.1.0"
description = "FMB peg-in-hole assets and success predicate for RoboLab (Isaac Lab)."
requires-python = ">=3.11"
# Dependencies are pinned in the root pyproject.toml.
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Must be installed: task files loaded by RoboLab import fmb.predicates.
include = ["fmb", "fmb.*"]
